name: "EA Build and Push Docker Image"
description: "Build a Docker image and push it to the EA container registry"

inputs:
  registry:
    description: "Container registry (e.g., docker.io, ghcr.io)"
    required: true
  registry-owner:
    description: "Registry image owner/namespace"
    required: true
  registry-username:
    description: "Registry username"
    required: true
  registry-password:
    description: "Registry password or token"
    required: true
  image-name:
    description: "Docker image name (e.g., plane-frontend)"
    required: true
  image-tag:
    description: "Docker image tag"
    required: true
    default: "latest"
  build-context:
    description: "Docker build context path"
    required: true
    default: "."
  dockerfile:
    description: "Path to Dockerfile"
    required: true
  build-args:
    description: "Docker build arguments"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Build and Push
      uses: docker/build-push-action@v5.1.0
      with:
        context: ${{ inputs.build-context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        tags: ${{ inputs.registry-owner }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
        push: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: ${{ inputs.build-args }}
      env:
        DOCKER_BUILDKIT: 1
