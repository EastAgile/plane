apiVersion: v1
kind: Pod
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml -o k8s/
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: migrator
  name: migrator
spec:
  imagePullSecrets:
    - name: docker-registry-key
  containers:
    - name: migrator
      image: rememberizer/plane-backend:local
      args:
        - ./bin/docker-entrypoint-migrator.sh
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
      envFrom:
        - secretRef:
            name: plane-secrets
        - configMapRef:
            name: plane-config
      env:
        - name: CORS_ALLOWED_ORIGINS
          value: http://localhost
        - name: WEB_URL
          value: http://localhost
      volumeMounts:
        - mountPath: /code/plane/logs
          name: logs-migrator
  restartPolicy: Never
  volumes:
    - name: logs-migrator
      persistentVolumeClaim:
        claimName: logs-migrator
