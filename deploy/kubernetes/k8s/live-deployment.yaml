apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml -o k8s/
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: live
  name: live
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: live
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml -o k8s/
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: live
    spec:
      imagePullSecrets:
        - name: docker-registry-key
      containers:
        - args:
            - node
            - live/dist/server.js
            - live
          envFrom:
            - secretRef:
                name: plane-secrets
            - configMapRef:
                name: plane-config
          image: makeplane/plane-live:stable
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          name: live
      restartPolicy: Always
