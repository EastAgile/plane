apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml -o k8s/
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: proxy
  name: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: proxy
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml -o k8s/
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: proxy
    spec:
      imagePullSecrets:
        - name: docker-registry-key
      containers:
        - envFrom:
            - secretRef:
                name: plane-secrets
            - configMapRef:
                name: plane-config
          image: rememberizer/plane-proxy:local
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          name: proxy
          ports:
            - containerPort: 80
              protocol: TCP
      restartPolicy: Always
