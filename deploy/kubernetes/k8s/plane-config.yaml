apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-config
  namespace: ea-tracker
data:
  API_BASE_URL: "http://api:8000"
  AWS_REGION: ""
  AWS_S3_BUCKET_NAME: "uploads"
  AWS_S3_ENDPOINT_URL: "http://plane-minio:9000"
  BUCKET_NAME: "uploads"
  CORS_ALLOWED_ORIGINS: "https://tracker.eastagile.com"
  DEBUG: "0"
  FILE_SIZE_LIMIT: "5242880"
  GUNICORN_WORKERS: "1"
  NGINX_PORT: "80"
  PGDATA: "/var/lib/postgresql/data"
  PGDATABASE: "plane"
  PGHOST: "192.168.1.131"
  POSTGRES_DB: "plane"
  POSTGRES_PORT: "5029"
  POSTGRES_USER: "plane"
  RABBITMQ_DEFAULT_VHOST: "plane"
  RABBITMQ_HOST: "plane-mq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "plane"
  REDIS_HOST: "plane-redis"
  REDIS_PORT: "6379"
  SENTRY_DSN: ""
  SENTRY_ENVIRONMENT: "production"
  USE_MINIO: "1"
  WEB_URL: "https://tracker.eastagile.com"
