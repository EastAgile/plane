apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml -o k8s/
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: plane-mq
  name: plane-mq
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: plane-mq
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml -o k8s/
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: plane-mq
    spec:
      imagePullSecrets:
        - name: docker-registry-key
      containers:
        - envFrom:
            - secretRef:
                name: plane-secrets
            - configMapRef:
                name: plane-config
          env:
            - name: CORS_ALLOWED_ORIGINS
              value: http://localhost
            - name: WEB_URL
              value: http://localhost
          image: rabbitmq:3.13.6-management-alpine
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          name: plane-mq
          volumeMounts:
            - mountPath: /var/lib/rabbitmq
              name: rabbitmq-data
      restartPolicy: Always
      volumes:
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: rabbitmq-data
