apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml -o k8s/
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: plane-redis
  name: plane-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: plane-redis
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml -o k8s/
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: plane-redis
    spec:
      imagePullSecrets:
        - name: docker-registry-key
      containers:
        - envFrom:
            - secretRef:
                name: plane-secrets
            - configMapRef:
                name: plane-config
          env:
            - name: CORS_ALLOWED_ORIGINS
              value: http://localhost
            - name: WEB_URL
              value: http://localhost
          image: valkey/valkey:7.2.5-alpine
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          name: plane-redis
          volumeMounts:
            - mountPath: /data
              name: redisdata
      restartPolicy: Always
      volumes:
        - name: redisdata
          persistentVolumeClaim:
            claimName: redisdata
