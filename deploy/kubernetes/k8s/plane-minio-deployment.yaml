apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml -o k8s/
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: plane-minio
  name: plane-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: plane-minio
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml -o k8s/
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: plane-minio
    spec:
      imagePullSecrets:
        - name: docker-registry-key
      containers:
        - args:
            - server
            - /export
            - --console-address
            - :9090
          envFrom:
            - secretRef:
                name: plane-secrets
            - configMapRef:
                name: plane-config
          env:
            - name: CORS_ALLOWED_ORIGINS
              value: http://localhost
            - name: WEB_URL
              value: http://localhost
          image: minio/minio:latest
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          name: plane-minio
          ports:
            - containerPort: 9000
              protocol: TCP
          volumeMounts:
            - mountPath: /export
              name: uploads
      restartPolicy: Always
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
